name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          Install-Module Pester -RequiredVersion 6.0.1 -Force -Scope CurrentUser

      - name: "Stage 1 - Static analysis"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # PSScriptAnalyzer 1.25.0 accepts only one System.String value for
          # -Path, not an array. Passing comma-separated paths therefore fails
          # with "Cannot convert 'System.Object[]'". Scan each path in turn.
          # ./tests is intentional: it contains MockApiServer.ps1, which uses
          # HttpListener, Start-Job, and stream handling.
          $paths    = @('./src', './tests')
          $findings = [System.Collections.Generic.List[object]]::new()
          $scanned  = 0

          foreach ($path in $paths) {
              $files = @(Get-ChildItem -Path $path -Recurse -File -Include '*.ps1', '*.psm1', '*.psd1')
              $scanned += $files.Count
              foreach ($finding in (Invoke-ScriptAnalyzer -Path $path -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)) {
                  $findings.Add($finding)
              }
          }

          # Without this guard, an empty or renamed path could make the stage
          # pass without analysing anything.
          if ($scanned -eq 0) { throw "No files were analysed: paths $($paths -join ', ') are empty or missing" }

          Write-Host "$scanned file(s) analysed"
          $findings | Format-Table -AutoSize
          if ($findings.Count -ne 0) { throw "PSScriptAnalyzer reported $($findings.Count) diagnostic(s)" }

      - name: "Stage 2 - Unit tests"
        shell: pwsh
        run: |
          $r = Invoke-Pester -Path ./tests/unit -Output Detailed -PassThru
          if ($r.Result -ne 'Passed' -or $r.FailedContainersCount -ne 0) { throw "Test suite failed: $($r.FailedCount) test(s), $($r.FailedContainersCount) container(s)" }

      - name: "Stage 3 - Canary"
        shell: pwsh
        run: |
          # This isolated gate runs before contract tests. If the mock-server
          # harness is broken, later results would be meaningless. Check
          # $r.Result rather than FailedCount because a test file that cannot
          # load does not necessarily increment FailedCount.
          $r = Invoke-Pester -Path ./tests/contract/Canary.Tests.ps1 -Output Detailed -PassThru
          if ($r.Result -ne 'Passed' -or $r.FailedContainersCount -ne 0) { throw "CANARY FAILED: the test harness is broken; subsequent results are not meaningful" }

      - name: "Stage 4 - Contract tests"
        shell: pwsh
        run: |
          $r = Invoke-Pester -Path ./tests/contract -Output Detailed -PassThru
          if ($r.Result -ne 'Passed' -or $r.FailedContainersCount -ne 0) { throw "Test suite failed: $($r.FailedCount) test(s), $($r.FailedContainersCount) container(s)" }

      - name: "Stage 5 - Security tests"
        shell: pwsh
        run: |
          $r = Invoke-Pester -Path ./tests/security -Output Detailed -PassThru
          if ($r.Result -ne 'Passed' -or $r.FailedContainersCount -ne 0) { throw "Test suite failed: $($r.FailedCount) test(s), $($r.FailedContainersCount) container(s)" }

      - name: "Stage 6 - Secret scanning"
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Stage 7 - Manifest validation"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest -Path ./src/EndpointOps/EndpointOps.psd1
